# Pushing a version tag such as v0.23.3 builds the plugin zip and publishes it as the latest release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        run: |
          version=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in .claude-plugin/plugin.json"
            exit 1
          fi
          if ! grep -q "^VERSION = \"$version\"$" skills/fund-blueprint/scripts/blueprint/constants.py; then
            echo "::error::VERSION in constants.py does not match $version in .claude-plugin/plugin.json"
            exit 1
          fi

      - name: Build the plugin zip
        run: |
          zip_path=$(bash .github/scripts/package.sh)
          cp "$zip_path" nxt-fund-blueprint.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" nxt-fund-blueprint.zip \
            --title "AI Strategy and Blueprint for PE Funds ${GITHUB_REF_NAME#v}" \
            --notes "AI Strategy and Blueprint for a private equity firm's own operations. Download nxt-fund-blueprint.zip and upload it on claude.ai under Customize > Plugins > Add > Upload plugin."
